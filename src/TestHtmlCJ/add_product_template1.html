<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إضافة منتج</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 20px;
        }
        .product {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
        }
        img {
            width: 120px;
        }
        a, button {
            padding: 6px 10px;
            text-decoration: none;
            color: white;
            border: none;
            cursor: pointer;
        }
        .details { background: blue; }
        .delete { background: red; }
        .add { background: green; margin-bottom: 20px; display: inline-block; }

    </style>

</head>
<body>

<h2>➕ إضافة منتج</h2>

<form method="post"    action="{{url_for('add_product_page')}}" >
    <input name="name" placeholder="اسم المنتج" ><br><br>
    <input name="price" type="number" placeholder="السعر" ><br><br>
    <input name="image" placeholder="رابط الصورة" ><br><br>
    <textarea name="details" placeholder="التفاصيل"></textarea><br><br>
    <button class="add">إضافة</button>
</form>

<a class="details" href="{{ url_for('index') }}">⬅ رجوع</a>

</body>
</html>
