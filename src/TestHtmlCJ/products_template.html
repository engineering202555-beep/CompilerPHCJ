<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>المنتجات</title>

    <link rel="stylesheet" href="Style.css">

</head>
<body>

<h1>🛒 المنتجات</h1>

<a class="add" href="{{ url_for('add_product_page') }}">➕ إضافة منتج</a>

{% for p in products %}
<div class="product">
    <img src="{{ p.image }}">
    <div>
        <h3>{{ p.name }}</h3>
        <p>السعر: {{ p.price }}$</p>

        <a class="details" href="{{ url_for('product_details', product_id=p.id) }}">تفاصيل</a>

        <form method="post"
              action="{{ url_for('delete_product', product_id=p.id) }}"
              style="display:inline;">
            <button class="delete">حذف</button>
        </form>
    </div>
</div>
{% endfor %}

</body>
</html>
